# =============================================================================
# ธีมของแอป "ก่อนจะค่อม" — pin เป็น light เท่านั้น
#
# ทำไมต้องมีไฟล์นี้ (และทำไมขาดไม่ได้):
#   src/theme.py จงใจไม่มี @media (prefers-color-scheme: dark) เพราะ "พื้นขาว"
#   คือทางเดียวของแอปนี้ การคุมธีมทั้งหมดจึงพึ่งไฟล์นี้เป็นด่านเดียว
#
#   ถ้าไฟล์นี้หาย -> Streamlit Cloud จะตามธีมของ OS/เบราว์เซอร์ผู้ชม
#   -> เครื่องที่ตั้ง dark mode จะได้ตัวอักษรในกล่องแจ้งเตือน (st.warning/st.info)
#      เป็นสีอ่อนบนพื้นอ่อน = จางจนมองไม่เห็น (บั๊กที่เจอตอน deploy ครั้งแรก)
# =============================================================================
[theme]
base = "light"
backgroundColor = "#FFFFFF"          # พื้นหลังหลัก — ขาวล้วน
secondaryBackgroundColor = "#F7F8F7" # พื้นรอง (sidebar / กล่องรอง)
textColor = "#151F1A"                # สีหมึก — ตรงกับ --bz-ink ใน theme.py
primaryColor = "#14476B"             # สีเน้น — ตรงกับ --bz-accent

[browser]
gatherUsageStats = false

[server]
headless = true
