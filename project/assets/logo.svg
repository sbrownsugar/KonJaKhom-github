<svg viewBox="0 0 128 128" width="128" height="128" role="img"
     aria-label="ก่อนจะค่อม" xmlns="http://www.w3.org/2000/svg">
  <title>ก่อนจะค่อม</title>
  <!--
    โลโก้ "ก่อนจะค่อม"
      · badge สี่เหลี่ยมมน ไล่สีฟ้า -> น้ำเงินเข้ม
      · โล่           -> ความปลอดภัย (ประเภทที่ส่งประกวด) / การป้องกันก่อนเกิดปัญหา
      · คนนั่ง        -> พฤติกรรมการนั่ง ซึ่งเป็นตัวการจริงตามสมการของเรา
      · ลูกศรทะลุออก  -> "อนาคต" ตามชื่อโครงงาน (กระจก*อนาคต*)

    *** สิ่งที่จงใจไม่ใส่ (อย่าเติมกลับโดยไม่อ่าน) ***
      - ไม่มีสามเหลี่ยมเตือน / จุดแดง / สีแดง บนกระดูกสันหลัง
        เพราะนั่นแปลว่า "กระดูกสันหลัง/ท่าทางของคุณคืออันตราย" ซึ่งเป็นข้ออ้างที่
        สมการของเราเองตั้งน้ำหนักเป็น 0 (Raine 2021 OR 0.24 / Mahmoud 2019 null)
        ถ้าใส่ = โลโก้เถียงกับโมเดลตัวเอง และกรรมการสายคลินิกจับได้ทันที
      - โลโก้นี้จึงสื่อว่า "เรามองพฤติกรรมการนั่ง และเราป้องกันไปข้างหน้า"
        ไม่ได้สื่อว่า "หลังคุณผิดปกติ"

    ไฟล์นี้ = สีตายตัว สำหรับ Word / สไลด์ / favicon
    ในแอปใช้ theme._logo_svg() ซึ่งเป็น inline SVG (id ไล่สีไม่ชนกับใคร)
  -->
  <defs>
    <linearGradient id="bzLogoGrad" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2FB4CC"/>
      <stop offset="0.55" stop-color="#1A5A94"/>
      <stop offset="1" stop-color="#0E2C57"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bzLogoGrad)"/>

  <path d="M64 22 L96 33 V63 C96 84 81 99 64 107 C47 99 32 84 32 63 V33 Z"
        fill="rgba(255,255,255,.10)" stroke="#EAF6FA" stroke-width="3.2" stroke-linejoin="round"/>

  <g stroke="#EAF6FA" stroke-width="5.4" fill="none" stroke-linecap="round">
    <path d="M50 55 C48 65 54 69 53 77"/>   <!-- หลัง / แนวสันหลัง -->
    <path d="M53 79 H70"/>                   <!-- ต้นขา -->
    <path d="M70 79 V93"/>                   <!-- หน้าแข้ง -->
  </g>
  <circle cx="50" cy="45" r="7.6" fill="#EAF6FA"/>

  <path d="M76 60 H104 M96 52 L104 60 L96 68" stroke="#6FE0F2" stroke-width="4.6"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
